# yaml-language-server: $schema=https://raw.githubusercontent.com/octo-sts/app/refs/heads/main/pkg/octosts/octosts.TrustPolicy.json
# Lets cm-testsuite's distribute and receive workflows, running on its main
# branch, open the draft pull request that proposes received tests here.
# The subject uses cm-testsuite's immutable owner and repository IDs.
issuer: https://token.actions.githubusercontent.com
subject: repo:vados-cosmonic@123968127/cm-testsuite@1447064737:ref:refs/heads/main
claim_pattern:
  job_workflow_ref: vados-cosmonic/cm-testsuite/\.github/workflows/(distribute|receive)\.yml@refs/heads/main

permissions:
  contents: write
  pull_requests: write
